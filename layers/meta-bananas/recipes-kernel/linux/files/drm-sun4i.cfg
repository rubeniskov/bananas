# Allwinner sun4i DRM stack + panel-dpi + pwm-backlight, needed for the
# BPI-M1+ 5" RGB888 LCD. Without DRM, the panel node in DT is parsed but
# never bound to a driver, so /sys/class/drm and /sys/class/backlight
# stay empty.

CONFIG_DRM=y
CONFIG_DRM_FBDEV_EMULATION=y

CONFIG_DRM_PANEL=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_DRM_PANEL_DPI=y

CONFIG_DRM_SUN4I=y
CONFIG_DRM_SUN4I_BACKEND=y
CONFIG_DRM_SUN4I_HDMI=y
CONFIG_DRM_SUN4I_HDMI_CEC=y

CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_PWM=y

CONFIG_PWM=y
CONFIG_PWM_SUN4I=y

# Lima — open-source GPU driver for Mali 400/450 (Allwinner A20).
# Pairs with mesa's lima Gallium driver for GLES2; userspace runs the
# Slint dashboard's femtovg renderer on the GPU. Mali-400 has no Mesa-
# only fallback path that handles GLES2 in hardware, so without this
# the dashboard would fall back to slow CPU rendering.
CONFIG_DRM_LIMA=m

# Framebuffer console on tty1 — `console=tty1` in bootargs only does
# something visible if fbcon is enabled. psplash opens /dev/fb0 directly
# so this isn't strictly required for the splash itself, but having
# fbcon means kernel oops messages appear on the LCD during a panic.
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y

# Append kernel-side cmdline knobs that quiet the boot output so psplash
# isn't constantly overdrawn by KERN_INFO. CONFIG_CMDLINE_EXTEND merges
# this onto whatever U-Boot passes in `bootargs` rather than replacing
# it, so console=, root=, etc. from U-Boot stay intact.
CONFIG_CMDLINE_BOOL=y
CONFIG_CMDLINE_EXTEND=y
CONFIG_CMDLINE="quiet loglevel=3 vt.global_cursor_default=0"
