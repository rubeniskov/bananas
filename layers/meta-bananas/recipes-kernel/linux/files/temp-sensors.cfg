# Temperature sensors that bananas-stats reads at /sys/class/{thermal,hwmon}.
#
# CPU thermal zone: the A20 exposes its on-die temp sensor through the
# combined touchscreen+THS driver `sun4i-ts` (CONFIG_TOUCHSCREEN_SUN4I).
# When that's loaded, /sys/class/thermal/thermal_zone0 appears with
# `type = cpu_thermal`. CONFIG_THERMAL_OF binds the zone to the DT node.
CONFIG_THERMAL=y
CONFIG_THERMAL_OF=y
CONFIG_THERMAL_GOV_STEP_WISE=y
CONFIG_INPUT=y
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_SUN4I=y

# HDD temp via SATA SMART, in-kernel — exposes
# /sys/block/sd*/device/hwmon/hwmonN/temp1_input. The drivetemp
# module reads SMART attribute 194 directly so the userspace sampler
# never has to fork smartctl. NVMe drives expose temp natively (no
# extra module needed).
CONFIG_HWMON=y
CONFIG_DRIVETEMP=m
