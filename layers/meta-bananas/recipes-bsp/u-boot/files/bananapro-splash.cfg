# Banana Pro / BPI-M1+ U-Boot splash screen.
#
# The board's LCD framebuffer is already initialized by meta-sunxi's
# defconfig — `Setting up a 800x480 lcd console (overscan 0x0)` shows
# in the U-Boot banner today. We just need the splash subsystem on top.
#
# `CONFIG_SPLASH_SCREEN_ALIGN` enables the `splashpos` env-var (`m,m`
# centers); `CONFIG_SPLASH_SOURCE` enables `splashsource=mmc_fs` reads
# (the BMP lives at /splash.bmp on the boot FAT, shipped via
# IMAGE_BOOT_FILES); `CONFIG_HIDE_LOGO_VERSION` suppresses the
# upstream "U-Boot 2024.01 ..." banner so the panel just shows the
# splash; `CONFIG_VIDEO_LOGO_MAX_SIZE` is bumped because the default
# 1 MiB is below our 1.1 MiB 24bpp 800x480 BMP.
CONFIG_SPLASH_SCREEN=y
CONFIG_SPLASH_SCREEN_ALIGN=y
CONFIG_SPLASH_SOURCE=y
CONFIG_BMP=y
CONFIG_BMP_24BPP=y
CONFIG_BMP_32BPP=y
CONFIG_VIDEO_BMP_GZIP=y
CONFIG_HIDE_LOGO_VERSION=y
CONFIG_VIDEO_LOGO_MAX_SIZE=0x180000
