# bananas-webadmin self-loop manifest — read by bananas-router so
# webadmin's own /api endpoints (login, me, users, exports, …) can
# be reached through the same `webadmin TCP → router → webadmin
# Unix sock` path that plugin /api/* requests follow. The router
# uses longest-prefix-match on api_prefix; cloud's "/api/cloud"
# (10 chars) beats webadmin's "/api" (4 chars) for cloud paths,
# so this catch-all only handles the leftovers (i.e. webadmin's
# actual API surface).
id = "webadmin"
label = "BanaNAS"
socket = "/run/bananas/webadmin.sock"
api_prefix = "/api"
