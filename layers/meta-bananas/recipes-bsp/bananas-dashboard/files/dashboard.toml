# BanaNAS LCD dashboard config — flat schema mirroring
# `bananas-dashboard`'s `DashboardConfig::default()`. Edit values
# here, then `systemctl restart bananas-dashboard.service` (or use
# the web admin's Settings → Dashboard form, which writes the file
# without restarting — bananas-dashboard polls mtime every 2 s).
#
# This file owns ONLY dashboard-side fields (UI appearance + the
# socket path it subscribes to). Sampler-side fields live in
# /etc/bananas/stats.toml.

# Render target — the BPI's 5" panel is 800x480 native.
width = 800
height = 480
title = "bananas-dashboard"

# "auto" picks dark in PM hours (12:00–23:59 local) and light in AM.
# "dark" or "light" pin the theme; press `t` at runtime to override.
theme = "auto"

# Number of historical points kept on the live sparklines.
spark_window = 60

# Minimum interval between UI repaints in milliseconds. The sampler
# still ticks at sampling.interval_ms (so historical SQLite data
# keeps its 1 Hz resolution), but the dashboard only forwards the
# latest snapshot to Slint at this cadence. Default 2000 ms — Mali-400
# + lima + femtovg is heavy enough that 1 Hz repaints saturate one
# core; the eye can't read sub-2-second changes on a 5" LCD anyway.
refresh_ms = 2000

# Where bananas-stats publishes; this dashboard subscribes here. Must
# match the path in /etc/bananas/stats.toml's [live_socket].
socket = "/run/bananas/stats.sock"
