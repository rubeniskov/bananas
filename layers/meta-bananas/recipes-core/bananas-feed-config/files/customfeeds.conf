# BanaNAS opkg feed — points at the GitHub Pages mirror published by
# .github/workflows/release.yml after each successful Yocto bake.
#
# One line per ${PACKAGE_ARCH} we ship across the supported boards:
#   * `all`              for allarch packages (bananas-feed-config,
#                        bananas-modprobe, etc.)
#   * `cortexa7t2hf-neon` for the armv7 Rust binaries baked from the
#                        Banana Pro target (bananas-webadmin, engine,
#                        router, stats, dashboard, config, …)
#   * `cortexa53`        for the aarch64 Rust binaries baked from the
#                        unified RPi target (RPi 3/4/5 share this PACKAGE_ARCH —
#                        the unified machine inherits cortexa53 as the
#                        lowest common ARMv8 baseline so binaries from
#                        the feed run on every supported RPi model)
#
# Every board ships the same `customfeeds.conf` — opkg silently 404s on
# the entries whose arch doesn't match the running system, so listing
# all three here keeps the file board-agnostic and means a future
# arch addition only needs a one-line change here, not a per-board fork.
#
# To pin to a specific release, point these URLs at /feed/v<X.Y.Z>/
# instead of /feed/latest/ — but the default tracks current.
src/gz bananas-all          https://rubeniskov.github.io/bananas/feed/latest/all
src/gz bananas-cortexa7     https://rubeniskov.github.io/bananas/feed/latest/cortexa7t2hf-neon
src/gz bananas-cortexa53    https://rubeniskov.github.io/bananas/feed/latest/cortexa53
