# BanaNAS opkg feed — points at the GitHub Pages mirror published by
# .github/workflows/release.yml after each successful Yocto bake.
#
# Three entries, one per ${PACKAGE_ARCH} that lands in
# build/tmp/deploy/ipk/. opkg fetches the matching Packages.gz index
# from each, then resolves package versions against all three when
# `opkg upgrade <pkg>` runs. To pin to a specific release, point
# these URLs at /feed/v<X.Y.Z>/ instead of /feed/latest/ — but the
# default tracks current.
src/gz bananas-all          https://rubeniskov.github.io/bananas/feed/latest/all
src/gz bananas-cortexa7     https://rubeniskov.github.io/bananas/feed/latest/cortexa7t2hf-neon
src/gz bananas-bananapro    https://rubeniskov.github.io/bananas/feed/latest/bananapro
