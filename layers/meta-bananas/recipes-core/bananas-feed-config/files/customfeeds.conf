# BanaNAS opkg feed — points at the GitHub Pages mirror published by
# .github/workflows/release.yml after each successful Yocto bake.
#
# Two entries, one per ${PACKAGE_ARCH} we actually ship:
#   * `all` for allarch packages (bananas-webadmin, bananas-feed-config,
#     bananas-modprobe, bananas-rclone — anything with `inherit allarch`)
#   * `cortexa7t2hf-neon` for the armv7 Rust binaries (bananas-server,
#     bananas-engine, bananas-stats, bananas-dashboard, bananas-config).
#
# We do NOT ship anything with PACKAGE_ARCH = bananapro (that's for
# truly machine-specific artifacts like u-boot/kernel which the SD-card
# image carries directly, never via opkg upgrade). Listing it here
# would just give opkg a 404 to whine about every `opkg update`.
#
# To pin to a specific release, point these URLs at /feed/v<X.Y.Z>/
# instead of /feed/latest/ — but the default tracks current.
src/gz bananas-all          https://rubeniskov.github.io/bananas/feed/latest/all
src/gz bananas-cortexa7     https://rubeniskov.github.io/bananas/feed/latest/cortexa7t2hf-neon
