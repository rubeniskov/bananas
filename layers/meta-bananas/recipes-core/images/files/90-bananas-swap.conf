# Keep swap cold on a NAS workload. swappiness=10 means the kernel
# only spills anonymous pages to swap under real memory pressure
# (rather than the default 60, which trims the page cache aggressively
# and writes to the SD even at low pressure). Bursty operations like
# rclone cold-sync, rsync of a large dataset, or e2fsck on a >1 TiB
# filesystem can momentarily exceed the BPI's 1 GiB RAM; swap is the
# safety net so the OOM killer doesn't reap bananas-server.
vm.swappiness = 10
