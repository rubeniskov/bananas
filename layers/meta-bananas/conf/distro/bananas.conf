DISTRO = "bananas"

# Inherit poky's defaults first, THEN override the user-facing strings.
# poky.conf assigns DISTRO / DISTRO_NAME / DISTRO_VERSION with `=` (not
# `?=`), so any value we set before the require gets clobbered — that's
# why /etc/issue used to read "Poky (Yocto Project Reference Distro)"
# AND /etc/motd used to print the "Poky is a reference Yocto Project
# distribution …" warning despite this layer carrying its own override.
# (`${DISTRO}/motd` file resolution sees DISTRO="poky" mid-parse and
# picks meta-poky's poky/motd over our bare files/motd.)
require conf/distro/poky.conf

# Re-assign here, AFTER the require, so DISTRO + DISTRO_NAME end up as
# the bananas values for the rest of the parse pass.
DISTRO = "bananas"
# /etc/issue + /etc/os-release format these as `<name> <version>`. We keep
# poky's DISTRO_VERSION (the upstream scarthgap release, e.g. 5.0.16) so
# operators can still see which Yocto release the image tracks.
DISTRO_NAME = "Bananas"

# Package format
PACKAGE_CLASSES = "package_ipk"

# Features for a headless NAS/server profile
DISTRO_FEATURES:append = " ipv4 ipv6 nfs zeroconf ssh opengl"

# Prefer systemd (optional but convenient for modern setups)
DISTRO_FEATURES:append = " systemd"
DISTRO_FEATURES:remove = " sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""

# Disable SPDX SBOM generation. Poky inherits create-spdx by default
# (compliance / supply-chain metadata for redistribution), but on
# scarthgap it has a known race where do_create_runtime_spdx can't
# find a runtime dependency's SPDX manifest across PACKAGE_ARCHs —
# bananas-webadmin (cortexa7t2hf-neon) RDEPENDS bananas-webadmin (all)
# triggers it reliably. SPDX is optional metadata; the bake doesn't
# need it to produce working IPKs. Re-enable when we have a real
# compliance story to feed.
INHERIT:remove = "create-spdx"

# Optional: stable hostname defaults etc. can be added via recipes
