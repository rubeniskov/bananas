#@TYPE: Machine
#@NAME: bananas-rpi
#@DESCRIPTION: Unified Raspberry Pi 3 / 4 / 5 NAS image — inherits the
#  raspberrypi3-64 machine config (cortexa53 ARMv8 baseline; binaries built
#  against it run on every supported RPi core), then ships all three boards'
#  device trees in the FAT firmware partition. A `boot.scr` (compiled from
#  layers/meta-bananas/recipes-bsp/bananas-rpi-bootscript/files/boot.cmd)
#  reads U-Boot's `${board_name}` at runtime and picks the matching DTB
#  before booti — same auto-detect mechanism Raspbian uses across the RPi
#  family.

require conf/machine/raspberrypi3-64.conf

MACHINEOVERRIDES =. "bananas-rpi:"

# Ship every supported RPi DTB in the FAT partition, not just the
# cortexa53-tuned default. := flattens immediately so a downstream
# `:append` from raspberrypi3-64.conf can't sneak in a stale single-DTB
# value after we set this.
KERNEL_DEVICETREE := " \
    broadcom/bcm2837-rpi-3-b.dtb \
    broadcom/bcm2837-rpi-3-b-plus.dtb \
    broadcom/bcm2711-rpi-4-b.dtb \
    broadcom/bcm2712-rpi-5-b.dtb \
"

# The bananas-rpi-bootscript recipe deploys boot.scr into ${DEPLOYDIR};
# IMAGE_BOOT_FILES is the wic-class hook that copies it into the FAT
# partition alongside config.txt + start.elf + the DTBs.
IMAGE_BOOT_FILES:append = " boot.scr"
