#@TYPE: Machine
#@NAME: bananas-rpi
#@DESCRIPTION: Unified Raspberry Pi 3 / 4 / 5 NAS image — inherits the
#  raspberrypi3-64 machine config (cortexa53 ARMv8 baseline; binaries built
#  against it run on every supported RPi core), then ships all three boards'
#  device trees in the FAT firmware partition. A `boot.scr` (compiled from
#  layers/meta-bananas/recipes-bsp/bananas-rpi-bootscript/files/boot.cmd)
#  reads U-Boot's `${board_name}` at runtime and picks the matching DTB
#  before booti — same auto-detect mechanism Raspbian uses across the RPi
#  family.

require conf/machine/raspberrypi3-64.conf

MACHINEOVERRIDES =. "bananas-rpi:"

# meta-raspberrypi's linux-raspberrypi.inc picks the per-MACHINE defconfig
# via `KBUILD_DEFCONFIG:raspberrypi3 ?= "bcm2709_defconfig"` (32-bit) and
# `:raspberrypi3-64 ?= "bcm2711_defconfig"` (aarch64). Because we inherit
# raspberrypi3-64.conf which `=.`-prepends "raspberrypi3:" to OVERRIDES,
# the resolved chain has `:raspberrypi3` later than our custom
# `:bananas-rpi` and the 32-bit bcm2709_defconfig wins — and the aarch64
# build dies looking for it under arch/arm64/configs/. The
# `:forcevariable` override always sits at the very end of OVERRIDES, so
# pinning here beats every other conditional. bcm2711_defconfig is the
# same config RPi 4 64-bit uses and carries every driver we need for
# RPi 3-64 + RPi 4-64 (USB, MMC, gigE, wifi-bcm). RPi 5 (BCM2712) is
# partially functional under bcm2711_defconfig — DTBs ship anyway so a
# future kernel bump can flip the defconfig without disturbing the
# recipe graph.
KBUILD_DEFCONFIG:forcevariable = "bcm2711_defconfig"

# Ship every supported RPi DTB in the FAT partition, not just the
# cortexa53-tuned default. := flattens immediately so a downstream
# `:append` from raspberrypi3-64.conf can't sneak in a stale single-DTB
# value after we set this.
KERNEL_DEVICETREE := " \
    broadcom/bcm2837-rpi-3-b.dtb \
    broadcom/bcm2837-rpi-3-b-plus.dtb \
    broadcom/bcm2711-rpi-4-b.dtb \
    broadcom/bcm2712-rpi-5-b.dtb \
"

# The bananas-rpi-bootscript recipe deploys boot.scr into ${DEPLOYDIR};
# IMAGE_BOOT_FILES is the wic-class hook that copies it into the FAT
# partition alongside config.txt + start.elf + the DTBs.
IMAGE_BOOT_FILES:append = " boot.scr"

# meta-raspberrypi defaults BOOT_SPACE to 40960 KB. With four DTBs
# (RPi 3 / 3B+ / 4 / 5), the rpi-bootfiles set, kernel8.img, and a
# stock aarch64 Image (~30 MB), the FAT runs out at do_image_rpi_sdimg
# with "Disk full". 128 MiB gives plenty of head-room for the unified
# image + future kernel growth without bloating the SD layout.
BOOT_SPACE = "131072"
