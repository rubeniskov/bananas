#@TYPE: Machine
#@NAME: Banana Pro
#@DESCRIPTION: Machine config for the LeMaker Banana Pro / BPI-M1+ (Allwinner A20)

require conf/machine/include/sun7i.inc

KERNEL_DEVICETREE = "allwinner/sun7i-a20-bananapro.dtb"
UBOOT_MACHINE = "Bananapro_defconfig"

# Switch mesa to the open-source `lima` driver for Mali-400 (and skip
# the closed-source sunxi-mali blobs). meta-sunxi's mesa_%.bbappend
# does `PACKAGECONFIG:append:use-mailine-graphics = " lima panfrost"`
# so this enables the lima Gallium driver on the full mesa build.
#
# meta-sunxi's `sunxi-mali.inc` tries to `include
# sunxi-mailine-graphics-drivers.inc` when this override is present —
# that file doesn't ship in scarthgap, but `include` (vs `require`)
# silently skips missing files, so we end up with no
# PREFERRED_PROVIDER_virtual/libgl pointed at mesa-gl + no sunxi-mali
# pulled in. The companion bbappend at
# layers/meta-bananas/recipes-graphics/mesa/mesa-gl_%.bbappend
# strips x11 from mesa-gl's PACKAGECONFIG so the bake can finish
# without DISTRO_FEATURES += "x11".
MACHINEOVERRIDES =. "use-mailine-graphics:"
