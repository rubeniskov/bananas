#@TYPE: Machine
#@NAME: Banana Pro
#@DESCRIPTION: Machine config for the LeMaker Banana Pro / BPI-M1+ (Allwinner A20)

# IMPORTANT: order matters here. `require sun7i.inc` recursively pulls
# in sunxi-mali.inc, which evaluates a conditional `include` against
# MACHINEOVERRIDES at parse time:
#   include ${@'sunxi-mali-driver.inc' if 'use-mailine-graphics' not
#            in d.getVar("MACHINEOVERRIDES").split(":") else ...}
# If we set use-mailine-graphics AFTER the require, the conditional
# already ran with the override absent, sunxi-mali-driver.inc got
# included, and PREFERRED_PROVIDER_virtual/libgles{1,2}=sunxi-mali was
# applied — which then makes the full `mesa` recipe ineligible to
# provide mesa-megadriver. Set MACHINEOVERRIDES first, THEN require.

# Switch mesa to the open-source `lima` driver for Mali-400 (and skip
# the closed-source sunxi-mali blobs). meta-sunxi's mesa_%.bbappend
# does `PACKAGECONFIG:append:use-mailine-graphics = " lima panfrost"`
# so this enables the lima Gallium driver on the full mesa build.
# The matching `sunxi-mailine-graphics-drivers.inc` doesn't ship in
# scarthgap, but `include` (vs `require`) silently skips missing
# files, so the override neutralises the sunxi-mali blob path entirely.
MACHINEOVERRIDES =. "use-mailine-graphics:"

require conf/machine/include/sun7i.inc

KERNEL_DEVICETREE = "allwinner/sun7i-a20-bananapro.dtb"
UBOOT_MACHINE = "Bananapro_defconfig"

# Both `mesa` (full) and `mesa-gl` (OpenGL-only) PROVIDE virtual/libgl
# and virtual/mesa. Without this, Yocto picks mesa-gl, which builds
# only the libgl/libegl bits — no libgbm package, no Gallium drivers
# beyond a few. The dashboard needs libgbm.so.1 (femtovg's GBM
# allocator) and mesa-driver-lima (Mali Gallium), both produced only
# by the full mesa recipe. Pin the providers explicitly.
PREFERRED_PROVIDER_virtual/libgl = "mesa"
PREFERRED_PROVIDER_virtual/mesa = "mesa"
PREFERRED_PROVIDER_virtual/libgbm = "mesa"

# Ship the U-Boot splash bitmap on the FAT boot partition. The
# bbappend in recipes-bsp/u-boot/ stages it into DEPLOYDIR; this
# entry tells the wic packer to copy it to /splash.bmp on the SD
# card's FAT alongside uImage and the dtb.
IMAGE_BOOT_FILES:append = " splash.bmp"
