#@TYPE: Machine
#@NAME: Banana Pro
#@DESCRIPTION: Machine config for the LeMaker Banana Pro / BPI-M1+ (Allwinner A20)

require conf/machine/include/sun7i.inc

KERNEL_DEVICETREE = "allwinner/sun7i-a20-bananapro.dtb"
UBOOT_MACHINE = "Bananapro_defconfig"

# Note: `MACHINEOVERRIDES =. "use-mailine-graphics:"` will flip mesa to
# the open-source `lima` driver for Mali-400 (and skip the closed-source
# sunxi-mali blobs). Re-enable when bananas-dashboard ships and needs
# GLES2 — without a userspace consumer of GLES the override doesn't buy
# us anything and the missing `sunxi-mailine-graphics-drivers.inc`
# leaves the system with no GPU userspace at all.
# MACHINEOVERRIDES =. "use-mailine-graphics:"
