# Continuous integration: runs on every push + PR. Fast (≈5 min on a
# default ubuntu-latest runner). The full Yocto bake is NOT exercised
# here — it ships as a separate job in release.yml because it needs
# >20 GB of working space and ~30 min of compile time. CI focuses on
# the things that catch real bugs before they hit a bake:
#
#   - rustfmt + clippy across the workspace
#   - cargo test across all host-side crates
#   - smoke cross-compile of the armv7 binaries (cargo-zigbuild)
#   - smoke wasm build of the Dioxus SPA (dx build)
#
# Slint dashboard cross-compile via cross-rs is intentionally NOT in
# this workflow — it spins up a Docker container per build and the
# multiarch fontconfig install pushes wall time over 10 min. It runs
# in the release workflow where speed matters less.

name: CI

on:
  # Push to feature branches (everything except main) — covers force-push
  # iterations on PRs and direct work on dev branches before they open a PR.
  push:
    branches-ignore: [main]
  # PRs targeting main — runs CI on the merge-preview ref so reviewers see
  # fail/pass against the actual proposed merge.
  pull_request:
    branches: [main]
  # Manual trigger for re-running CI on demand (e.g. after a flaky run).
  workflow_dispatch:

# Push-to-main is intentionally NOT a trigger here. The only way to land
# on main is via a merged PR, and that PR's CI already ran green on the
# merge-preview ref — running it again on the resulting merge commit is
# pure runner-minute waste. release.yml still fires on push-to-main
# because that's where the release bake/publish lives.

# Single-flight per ref: a force-push or follow-up commit cancels the
# previous run so we don't waste runner minutes on stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Pre-commit hooks (prek) ────────────────────────────────────
  # Mirrors what `prek install` runs locally on pre-commit + pre-push,
  # so a PR can't slip through with a hook that wasn't installed on
  # the contributor's machine. `prek run --all-files --hook-stage pre-push`
  # picks up the heavy stages too (cargo clippy / test / wasm check).
  prek:
    name: prek (fmt + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Split the cache: the cargo registry rarely changes between
      # Cargo.lock bumps (it's just downloaded crate sources), but
      # `target/` is invalidated by every code change. Sharing one key
      # meant a Cargo.lock bump flushed the registry too — paying the
      # crates.io fetch all over again. Two caches with different
      # invalidation cadences keep the registry warm.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target (host)
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-host-

      - name: Install prek
        uses: j178/prek-action@v1
        # Fall back to cargo-install if the marketplace action ever
        # disappears — prek's own README documents `cargo install
        # --locked prek` as the supported install.
        continue-on-error: true
        id: install_prek

      - name: Install prek (fallback)
        if: steps.install_prek.outcome != 'success'
        run: cargo install --locked prek

      # Install dioxus-cli so each daemon's build.rs produces real
      # SPA bytes; without dx the build.rs gracefully skips and the
      # daemon ships an empty include_dir!, so the browser's first
      # request returns the host shell with no plugin SPAs and the
      # nav.app-nav probes fail. Use cargo-binstall to grab the
      # prebuilt release tarball (a few seconds vs ~6 min compile).
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli (binstall)
        run: cargo binstall -y --version ^0.7 dioxus-cli

      # `--all-files` runs every hook against every tracked file (CI
      # doesn't have a "changed since last commit" signal that maps to
      # prek's git-aware default). The `pre-push` stage adds clippy +
      # tests + wasm check on top of the always-on pre-commit gates.
      #
      # BANANAS_E2E_TIMEOUT_MS bumps the e2e harness's wait_for_function
      # deadline (default 10s) — GitHub Actions runners paint Dioxus
      # SPAs noticeably slower than a dev laptop, so 30s prevents flake.
      - name: prek run --all-files --hook-stage pre-push
        env:
          BANANAS_E2E_TIMEOUT_MS: "30000"
        run: prek run --all-files --hook-stage pre-push --show-diff-on-failure

  cross:
    name: Cross-compile (${{ matrix.machine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: bananas-bpi
            tune: cortexa7t2hf-neon
            rust_target: armv7-unknown-linux-gnueabihf
            elf_grep: "ARM"           # `file` prints "ARM, EABI5..." for armv7
            build_webadmin: build-webadmin-arm
            build_stats: build-stats-arm
          - machine: bananas-rpi
            tune: cortexa53
            rust_target: aarch64-unknown-linux-gnu
            elf_grep: "aarch64"
            build_webadmin: build-webadmin-arm64
            build_stats: build-stats-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.66.0
          cache: true

      # pixi ships rust via conda but not the per-target std; cargo-zigbuild
      # still needs the matching sysroot. rust-toolchain installs the host
      # toolchain + the per-machine cross target; rustup target add below
      # adds wasm32 for the SPA build invoked by each daemon's build.rs.
      - name: Install rust toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target (cross ${{ matrix.tune }})
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-cross-${{ matrix.tune }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-cross-${{ matrix.tune }}-

      # Add wasm32 target so the SPA build inside each daemon's build.rs
      # (invoked by dx) can compile.
      - name: Install rust wasm target
        run: rustup target add wasm32-unknown-unknown

      # pixi tasks already strip the conda-injected CFLAGS that would
      # leak `-march=haswell` into the rusqlite-bundled cross-compile.
      # build-webadmin-arm{,64} cross-compiles all daemons (webadmin,
      # engine, router, cloud, exports, storage, users, stats-web,
      # dashboard-web) in one zigbuild invocation; build.rs of each
      # invokes dx for the embedded SPA, hence the wasm32 target above
      # + setup-dx via the task's depends-on.
      - name: ${{ matrix.build_webadmin }}
        run: pixi run ${{ matrix.build_webadmin }}

      - name: ${{ matrix.build_stats }}
        run: pixi run ${{ matrix.build_stats }}

      # Smoke-confirm the binaries match the target arch — protects
      # against the pixi env accidentally picking up the host toolchain
      # or the wrong --target leaking through. Per-arch dir matches the
      # FILESEXTRAPATHS:prepend in every plugin recipe.
      - name: Verify cross ELFs
        run: |
          DEST=serve/bin/${{ matrix.tune }}
          for bin in bananas-webadmin bananas-engine bananas-stats; do
            file "$DEST/$bin" | grep -q "${{ matrix.elf_grep }}" || {
              echo "::error::$bin is not ${{ matrix.elf_grep }} ($(file $DEST/$bin))"
              exit 1
            }
          done
