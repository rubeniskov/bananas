# Release pipeline: runs on push to main, ONLY when CI is green and
# the conventional-commit history since the last tag implies a release.
# Driven by semantic-release (see .releaserc.json) which:
#
#   1. Parses commit messages from `git log <last-tag>..HEAD`.
#   2. Decides on the next version (major / minor / patch / no-release).
#   3. Generates / updates CHANGELOG.md from the commit bodies.
#   4. Tags the repo (`vX.Y.Z`) and pushes.
#   5. Creates a GitHub release with the bundled artifacts attached.
#
# Artifacts shipped:
#   - bananas-server-vX.Y.Z-armv7.tar.gz       (server + helper)
#   - bananas-stats-vX.Y.Z-armv7.tar.gz        (sampler daemon)
#   - bananas-ui-vX.Y.Z.tar.gz                 (wasm SPA)
#   - bananas-dashboard-vX.Y.Z-armv7.tar.gz    (Slint LCD app)
#
# The Yocto bake also runs here so every release ships an SD-card image
# the operator can `dd` onto a card without touching pixi/kas. Hosted
# ubuntu-latest only gives ~14 GB free out of the box, so we reclaim
# ~25 GB via easimon/maximize-build-space and cache build/sstate-cache
# + build/downloads between runs to bring a warm bake in around 10 min.

name: Release

on:
  push:
    branches: [main]

# One release at a time. Two pushes to main in quick succession queue
# rather than race — semantic-release's tag/push step would explode
# otherwise.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Skip release if the head commit is just CHANGELOG / version
    # bumping by semantic-release itself (the bot trailer marks them).
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    steps:
      # Yocto needs ≈20 GB working space + pixi's conda cache (~5 GB), and
      # default ubuntu-latest only ships ~14 GB free on /. easimon's action
      # was creating a loop-backed LVM that ATE the very root filesystem
      # we needed (jumping / from 56→144 GB used, leaving 1 GB free for
      # pixi's cache). jlumbroso's just deletes the unused .NET / Android /
      # Haskell / CodeQL trees in place — about 25 GB freed on /, where
      # both pixi and the bake actually live. No LVM, no symlinks.
      - name: Free disk space for the Yocto bake
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false  # keep nodejs/python/go — we use them
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          # semantic-release walks tags + history to compute the next
          # version, so it needs full history.
          fetch-depth: 0
          # Use a separate token if you want signed tags / PR comments —
          # the default GITHUB_TOKEN works for normal releases.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install host packages required by bitbake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            chrpath cpio diffstat file rpcsvc-proto zstd

      # Ubuntu 24.04 (the new ubuntu-latest as of 2025) ships with
      # AppArmor restricting unprivileged user namespaces by default,
      # which BitBake needs for `pseudo`'s fakeroot. Without this:
      #   ERROR: User namespaces are not usable by BitBake, possibly due to AppArmor.
      # See: https://discourse.ubuntu.com/t/ubuntu-24-04-lts-noble-numbat-release-notes/39890#unprivileged-user-namespace-restrictions
      - name: Allow unprivileged user namespaces (BitBake requirement on Ubuntu 24.04)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.66.0
          cache: true

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,armv7-unknown-linux-gnueabihf

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      # ─── Build all the artifacts the release will publish ─────────
      - name: build-ui
        run: pixi run build-ui

      - name: build-server-arm
        run: pixi run build-server-arm

      - name: build-stats-arm
        run: pixi run build-stats-arm

      # cross-rs needs Docker; ubuntu-latest has it preinstalled.
      - name: build-dashboard-arm
        run: pixi run build-dashboard-arm

      # ─── Yocto bake → SD card image ───────────────────────────────
      # Cache the two big Yocto caches between runs. Cold bake takes ~30 min;
      # a warm cache (sstate hits) typically drops it to ~10 min. The cache
      # key is keyed on the layer + recipe + machine config so any patch /
      # version bump invalidates it cleanly.
      - name: Cache Yocto sstate + downloads
        uses: actions/cache@v4
        with:
          path: |
            build/sstate-cache
            build/downloads
          key: ${{ runner.os }}-yocto-${{ hashFiles('kas.yml', 'layers/**/*.bb', 'layers/**/*.bbappend', 'layers/**/*.conf', 'layers/**/*.inc', 'layers/**/files/**') }}
          restore-keys: |
            ${{ runner.os }}-yocto-

      # bbfatal in `bananas-image.bb` requires both env vars at build
      # time. They're embedded in /etc/exports + /etc/shadow respectively.
      # ROOT_PASSWORD_HASH is a fixed placeholder hash; the image's
      # `expire_root_password` postprocess sets shadow's lastchg=0 so the
      # operator is forced to rotate it on first sign-in (PAM enforces it
      # on console + the web UI's "set new password" form catches it
      # before granting a session). NFS_EXPORT_NETWORK defaults to a
      # broad home-LAN range; tighten via the Exports tab post-boot.
      - name: Bake Yocto image
        env:
          ROOT_PASSWORD_HASH: '$6$bananas$bananas'
          NFS_EXPORT_NETWORK: '192.168.0.0/16'
        run: pixi run build

      # ─── Stage tarballs for semantic-release to upload ────────────
      - name: Pack artifacts
        run: |
          set -e
          mkdir -p dist
          tar -C serve/bin -czf dist/bananas-server-armv7.tar.gz bananas-server bananas-helper
          tar -C serve/bin -czf dist/bananas-stats-armv7.tar.gz bananas-stats
          tar -C serve/bin -czf dist/bananas-dashboard-armv7.tar.gz bananas-dashboard
          cp serve/bin/bananas-ui.tar.gz dist/bananas-ui.tar.gz
          # Wrap the .wic in tar.gz so every release asset uses the same
          # compression format. Yocto's stable symlink is *.rootfs.wic;
          # `-h` dereferences it so the tarball gets the actual data, and
          # `--transform` strips the `.rootfs` infix so the extracted file
          # has a clean dd-friendly name. Operator workflow on the
          # receiving side:
          #   tar -xzf bananas-image-armv7.tar.gz
          #   sudo dd if=bananas-image-bananapro.wic of=/dev/sdX bs=4M status=progress conv=fsync
          tar -czhf dist/bananas-image-armv7.tar.gz \
              --transform 's,^bananas-image-bananapro.rootfs.wic$,bananas-image-bananapro.wic,' \
              -C build/tmp/deploy/images/bananapro \
              bananas-image-bananapro.rootfs.wic
          ls -la dist/

      # ─── Run semantic-release ─────────────────────────────────────
      - name: Setup Node (for semantic-release)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release + plugins
        run: |
          npm install -g \
            semantic-release@22 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/github@9 \
            @semantic-release/commit-analyzer@11 \
            @semantic-release/release-notes-generator@12

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release
