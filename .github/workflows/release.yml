# Release pipeline: runs on push to main, ONLY when CI is green and
# the conventional-commit history since the last tag implies a release.
# Driven by semantic-release (see .releaserc.json) which:
#
#   1. Parses commit messages from `git log <last-tag>..HEAD`.
#   2. Decides on the next version (major / minor / patch / no-release).
#   3. Generates / updates CHANGELOG.md from the commit bodies.
#   4. Tags the repo (`vX.Y.Z`) and pushes.
#   5. Creates a GitHub release with the bundled artifacts attached.
#
# Artifacts shipped:
#   - bananas-server-vX.Y.Z-armv7.tar.gz       (server + helper)
#   - bananas-stats-vX.Y.Z-armv7.tar.gz        (sampler daemon)
#   - bananas-webadmin-vX.Y.Z.tar.gz           (wasm SPA)
#   - bananas-dashboard-vX.Y.Z-armv7.tar.gz    (Slint LCD app)
#
# The Yocto bake also runs here so every release ships an SD-card image
# the operator can `dd` onto a card without touching pixi/kas. Hosted
# ubuntu-latest only gives ~14 GB free out of the box, so we reclaim
# ~25 GB via easimon/maximize-build-space and cache build/sstate-cache
# + build/downloads between runs to bring a warm bake in around 10 min.

name: Release

on:
  push:
    branches: [main]

# One release at a time. We cancel queued/in-flight runs when a new
# push lands so the freshest commit always wins — without this, a long
# Yocto bake from an older commit can finish, push a chore(release)
# bump, and then a queued run on a stale checkout sees "behind remote"
# and silently no-ops.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    # Skip release if the head commit is just CHANGELOG / version
    # bumping by semantic-release itself. The substring match was too
    # greedy — any commit whose body referenced "chore(release):"
    # (e.g. discussing the auto-bump in a normal fix/feat commit) was
    # being skipped. Anchor on the subject line's prefix instead.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      # Yocto needs ≈20 GB working space; the standard ubuntu-latest
      # runner ships with 145 GB / 90 GB free which is comfortably more
      # than the ~30 GB we end up using through the bake. The previous
      # `Free disk space for the Yocto bake` step (jlumbroso/
      # free-disk-space) was burning 2m30s on every release deleting
      # Android/.NET/Haskell trees we never touched. The 14-GB claim
      # the old comment cited was for an older runner generation —
      # measured on real runs the disk is roomy. The post-bake `df -h`
      # below confirms it.
      - uses: actions/checkout@v4
        with:
          # semantic-release walks tags + history to compute the next
          # version, so it needs full history.
          fetch-depth: 0
          # Use a separate token if you want signed tags / PR comments —
          # the default GITHUB_TOKEN works for normal releases.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install host packages required by bitbake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            chrpath cpio diffstat file rpcsvc-proto zstd

      # Ubuntu 24.04 (the new ubuntu-latest as of 2025) ships with
      # AppArmor restricting unprivileged user namespaces by default,
      # which BitBake needs for `pseudo`'s fakeroot. Without this:
      #   ERROR: User namespaces are not usable by BitBake, possibly due to AppArmor.
      # See: https://discourse.ubuntu.com/t/ubuntu-24-04-lts-noble-numbat-release-notes/39890#unprivileged-user-namespace-restrictions
      - name: Allow unprivileged user namespaces (BitBake requirement on Ubuntu 24.04)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.66.0
          cache: true

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,armv7-unknown-linux-gnueabihf

      # Cache keyed on **/Cargo.toml (deps + version constraints), NOT
      # Cargo.lock. The lock file gets rewritten by bump-cargo-version.sh
      # on every release (workspace member version + lockfile metadata),
      # which means a Cargo.lock-keyed primary key NEVER hits — the
      # cache only restores via the restore-keys fallback. Since dep
      # versions in the manifests are what actually drive what cargo
      # has to (re)compile, hashing Cargo.toml is the right primary
      # signal: stable across releases that don't add deps. cargo
      # itself reconciles any lockfile drift from the restored target/.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo target (release)
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-release-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-release-

      # ─── Compute the next release version BEFORE building so the
      # binaries embed it via env!("CARGO_PKG_VERSION"). Without this,
      # builds run against the still-stale Cargo.toml, semantic-release
      # bumps it after the build, and the published tarballs ship
      # binaries that report `--version` one release behind the tag.
      # The helper's InstallUpdate then refuses the swap with
      # "extracted X reports version Y, expected Z".
      #
      # Setup Node early (was at the very end) so npx can run dry-run
      # and the same toolchain serves the final publish step.
      - name: Setup Node (for semantic-release)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release + plugins
        # conventional-changelog-conventionalcommits is a peer dep
        # requested by both commit-analyzer's `preset: "conventionalcommits"`
        # and release-notes-generator's `preset: "conventionalcommits"`.
        # @semantic-release/exec is no longer in .releaserc.json (we do
        # the bump in the workflow now) but stays installed in case
        # we ever wire it back for a different prepare hook.
        run: |
          npm install -g \
            semantic-release@22 \
            @semantic-release/changelog@6 \
            @semantic-release/exec@6 \
            @semantic-release/git@10 \
            @semantic-release/github@9 \
            @semantic-release/commit-analyzer@11 \
            @semantic-release/release-notes-generator@12 \
            conventional-changelog-conventionalcommits@7

      - name: Sync with origin/main
        # semantic-release's analysis walks the actual git history; if
        # the runner's checkout is behind a sibling release run's
        # chore(release) commit, it'll bail with "local branch is
        # behind remote". Pull once at the top so all downstream steps
        # see the latest tip.
        run: git pull --rebase origin main

      - name: Compute next release version (dry-run)
        id: nextver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--dry-run` runs analyzeCommits + generateNotes only; it does
        # NOT execute prepare hooks or push anything. We grep the next
        # version out of stdout. If commit-analyzer decides nothing is
        # releasable (no feat:/fix:/perf:/refactor: since the last tag),
        # leave NEXT empty — downstream steps short-circuit and skip
        # the bump + the publish step bails the same way.
        run: |
          set +e
          out=$(semantic-release --dry-run --no-ci 2>&1)
          set -e
          echo "$out"
          next=$(echo "$out" | grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' | awk '{print $5}' | head -1)
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          if [ -n "$next" ]; then
            echo "::notice::Next release will be v${next}"
          else
            echo "::notice::No releaseable commits since last tag — building at current Cargo.toml version"
          fi

      - name: Bump Cargo.toml + Cargo.lock to next release version
        if: steps.nextver.outputs.next != ''
        # Bumping BEFORE the build is the whole point of this dance.
        # The script is idempotent — semantic-release's @semantic-release/git
        # plugin will then commit the (already-bumped) Cargo.toml +
        # Cargo.lock as part of its chore(release) commit at publish time.
        run: scripts/bump-cargo-version.sh ${{ steps.nextver.outputs.next }}

      # ─── Build all the artifacts the release will publish ─────────
      - name: build-webadmin
        run: pixi run build-webadmin

      - name: build-server-arm
        run: pixi run build-server-arm

      - name: build-stats-arm
        run: pixi run build-stats-arm

      # cross-rs needs Docker; ubuntu-latest has it preinstalled.
      - name: build-dashboard-arm
        run: pixi run build-dashboard-arm

      - name: build-config-arm
        run: pixi run build-config-arm

      # Download the upstream rclone armv7 prebuilt into serve/bin/. The
      # bananas-rclone.bb recipe pulls from there; without this step the
      # bake fails with "Unable to get checksum for bananas-rclone
      # SRC_URI entry rclone: file could not be found".
      - name: setup-rclone-arm
        run: pixi run setup-rclone-arm

      # ─── Yocto bake → SD card image ───────────────────────────────
      # Cache the two big Yocto caches between runs. Cold bake takes ~30 min;
      # a warm cache (sstate hits) typically drops it to ~10 min. The cache
      # key is keyed on the layer + recipe + machine config so any patch /
      # version bump invalidates it cleanly.
      - name: Cache Yocto sstate + downloads
        uses: actions/cache@v4
        with:
          path: |
            build/sstate-cache
            build/downloads
          key: ${{ runner.os }}-yocto-${{ hashFiles('kas.yml', 'layers/**/*.bb', 'layers/**/*.bbappend', 'layers/**/*.conf', 'layers/**/*.inc', 'layers/**/files/**') }}
          restore-keys: |
            ${{ runner.os }}-yocto-

      # All build-time env vars (ROOT_PASSWORD_HASH, NFS_EXPORT_NETWORK)
      # are optional now: the recipe ships an empty /etc/exports + an
      # empty /etc/fstab and uses a "bananas" placeholder root hash that
      # lastchg=0 marks expired. Operators configure exports + mounts via
      # the web UI on first boot.
      - name: Bake Yocto image
        run: pixi run build

      # Sanity check after the bake — surfaces actual peak usage.
      # If `Avail` here ever drops under ~10 GB we should reconsider
      # putting the disk-cleanup step back.
      - name: Disk usage after bake
        if: always()
        run: |
          echo "::group::df -h /"
          df -h /
          echo "::endgroup::"
          echo "::group::biggest things on /"
          du -h --max-depth=2 / 2>/dev/null | sort -hr | head -25 || true
          echo "::endgroup::"

      # ─── Stage the SD-card image for semantic-release to upload ──
      # In-place updates flow through the opkg feed (gh-pages branch)
      # now, so the only release-page asset is the full SD-card image
      # for fresh-flash bootstrap. Per-component tarballs +
      # SHA256SUMS are gone — opkg's Packages index has its own
      # checksums and the gh-pages workflow below mirrors the IPKs.
      - name: Pack artifacts
        run: |
          set -e
          mkdir -p dist
          # Wrap the .wic in tar.gz for download convenience. Yocto's
          # stable symlink is *.rootfs.wic; `-h` dereferences it so the
          # tarball carries the actual data, and `--transform` strips
          # the `.rootfs` infix so the extracted file has a clean
          # dd-friendly name. Operator workflow on the receiving side:
          #   tar -xzf bananas-image-armv7.tar.gz
          #   sudo dd if=bananas-image-bananapro.wic of=/dev/sdX bs=4M status=progress conv=fsync
          tar -czhf dist/bananas-image-armv7.tar.gz \
              --transform 's,^bananas-image-bananapro.rootfs.wic$,bananas-image-bananapro.wic,' \
              -C build/tmp/deploy/images/bananapro \
              bananas-image-bananapro.rootfs.wic
          ls -la dist/

      # ─── opkg feed publishing ─────────────────────────────────────
      # `bitbake package-index` regenerates the per-arch Packages /
      # Packages.gz index files inside build/tmp/deploy/ipk/ — Yocto
      # writes the indices alongside the .ipk files but they're not
      # always refreshed automatically when only some packages change.
      # Running it explicitly is cheap and guarantees the gh-pages
      # mirror is internally consistent.
      - name: Refresh opkg package index
        run: |
          eval "$(pixi shell-hook --shell bash)"
          kas shell kas.yml -c 'bitbake package-index'

      # Stage the IPK tree for gh-pages publication. Mirrors only the
      # three arch directories we care about (all, bananapro,
      # cortexa7t2hf-neon) — the deploy/ipk/ root may also contain
      # work-shared subdirs that we don't want operators to see.
      - name: Stage feed for gh-pages
        run: |
          set -e
          mkdir -p feed-publish/feed/latest
          for arch in all bananapro cortexa7t2hf-neon; do
            if [ -d "build/tmp/deploy/ipk/$arch" ]; then
              cp -r "build/tmp/deploy/ipk/$arch" "feed-publish/feed/latest/$arch"
            fi
          done
          # Tiny landing page so https://<owner>.github.io/<repo>/ has
          # something to render rather than a 404 — pure documentation,
          # not consumed by opkg.
          cat > feed-publish/index.html <<'EOF'
          <!doctype html>
          <meta charset=utf-8>
          <title>BanaNAS opkg feed</title>
          <h1>BanaNAS opkg feed</h1>
          <p>This branch hosts <code>.ipk</code> packages for the
          BanaNAS distribution. Devices configured via
          <code>/etc/opkg/customfeeds.conf</code> consume it directly;
          there is nothing here for a browser to do.</p>
          <p>Repo: <a href="https://github.com/rubeniskov/bananas">rubeniskov/bananas</a></p>
          EOF
          ls -R feed-publish/feed/latest | head -40

      # Push to the gh-pages branch. peaceiris/actions-gh-pages
      # creates the branch if it doesn't exist; first run requires
      # the operator to enable Pages on the repo (Settings →
      # Pages → Source: gh-pages branch). keep_files: false so the
      # feed always reflects the latest release exactly — old IPKs
      # that aren't part of this build are pruned.
      - name: Publish opkg feed to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./feed-publish
          publish_branch: gh-pages
          keep_files: false
          commit_message: "feed(opkg): publish ${{ github.sha }}"

      # ─── Publish ──────────────────────────────────────────────────
      # semantic-release was already installed early (before the dry-run
      # version computation), so this step just publishes. The bump
      # script ran pre-build, so Cargo.toml + Cargo.lock are already at
      # the target version in the working tree — @semantic-release/git
      # commits them as part of the chore(release) commit it pushes.
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release
