header:
  version: 14
  includes:
    - kas-base.yml

# Banana Pro (BPI-M1+ / sun7i-a20) overlay. MACHINE name `bananas-bpi`
# mirrors the `bananas-rpi` unified-RPi MACHINE — both are bananas-flavour
# names that point at our own conf/machine/ files (no name clash with
# meta-sunxi, which only ships `bananapi`).
machine: bananas-bpi

repos:
  meta-sunxi:
    url: "https://github.com/linux-sunxi/meta-sunxi.git"
    branch: "scarthgap"
    layers:
      .:

local_conf_header:
  bananas-bpi-image: |
    # Output an SD-card-flashable wic image alongside the rootfs tarball.
    # The release pipeline tars the .wic into bananas-image-bpi.tar.gz so
    # operators get one consistent .tar.gz format across every release
    # asset; the rootfs tar.gz itself stays around for the iterate loop's
    # NFS netboot path.
    IMAGE_FSTYPES = "wic tar.gz"

    # Serial console (sun7i UART0).
    SERIAL_CONSOLES = "115200;ttyS0"
