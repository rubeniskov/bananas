<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="200" cy="180" r="120" fill="url(#sunGradient)" />

  <g filter="url(#shadow)">
    <path d="M120,220 Q160,150 280,180 Q240,280 120,220" fill="#FFE135" stroke="#333" stroke-width="2" />
    <path d="M115,225 L100,240" stroke="#333" stroke-width="5" stroke-linecap="round" /> <rect x="160" y="200" width="10" height="4" rx="1" fill="#333" opacity="0.2"/>
    <rect x="180" y="205" width="10" height="4" rx="1" fill="#333" opacity="0.2"/>
    <rect x="200" y="202" width="10" height="4" rx="1" fill="#333" opacity="0.2"/>
  </g>

  <path d="M100,300 Q150,280 200,300 T300,300" fill="none" stroke="#008080" stroke-width="8" stroke-linecap="round" />
  <path d="M80,330 Q140,310 200,330 T320,330" fill="none" stroke="#40E0D0" stroke-width="6" stroke-linecap="round" />

  <text x="50%" y="385" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-weight="900" font-size="50" fill="#333" style="letter-spacing: 2px;">BANANAS</text>
  <text x="50%" y="130" text-anchor="middle" font-family="monospace" font-size="12" fill="#FFF" font-weight="bold" letter-spacing="4">NETWORK STORAGE</text>
</svg>