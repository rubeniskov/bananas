[package]
name = "bananas-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bananas-helper"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha-crypt.workspace = true
sha2.workspace = true
toml.workspace = true
flate2.workspace = true
tar.workspace = true

[dev-dependencies]
tempfile = "3"
# install::tests share process-global env vars (BANANAS_UPDATES_STAGING_DIR
# etc) — running them in parallel races. serial_test guards them with a
# per-test mutex so cargo test's default --test-threads=N still works.
serial_test = "3"
