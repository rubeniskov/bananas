[package]
name = "bananas-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bananas-engine"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha-crypt.workspace = true
sha2.workspace = true
toml.workspace = true
# tonic server for the gRPC half of the engine socket. The
# legacy newline-JSON loop on `BANANAS_ENGINE_SOCKET` stays for
# unmigrated commands; the gRPC mount on
# `BANANAS_ENGINE_GRPC_SOCKET` carries Authenticate today and
# more in subsequent PRs.
bananas-proto = { workspace = true, features = ["server"] }
tonic = { workspace = true, features = ["server", "router", "transport"] }
tonic-prost = "0.14"
prost.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile = "3"
# opkg::tests override BANANAS_OPKG_BIN per-test; running them in
# parallel races on the env var. serial_test guards them with a
# per-test mutex so cargo test's default --test-threads=N still works.
serial_test = "3"
# tests/auth.rs hashes test passwords for `/etc/shadow` ($6$ SHA-512).
# main.rs already pulls sha-crypt in via [dependencies], but the
# integration tests link the lib crate (not the bin), so we re-add
# it here.
sha-crypt.workspace = true
# gRPC client for tests/auth_grpc.rs — connects to the engine's
# tonic Unix socket via a tower service-fn connector.
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
