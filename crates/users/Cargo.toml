[package]
name = "bananas-users"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "bananas-users"
path = "src/main.rs"

[[bin]]
name = "bananas-users-ui"
path = "src/ui/main.rs"
required-features = ["wasm-ui"]

[features]
default = []
wasm-ui = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
axum = { workspace = true, features = ["macros"] }
anyhow.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower-http.workspace = true
bananas-proto = { workspace = true, features = ["server"] }
tonic = { workspace = true, features = ["transport"] }
bananas-server-common.workspace = true
include_dir = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bananas-mfe-runtime.workspace = true
dioxus.workspace = true
gloo-net = { workspace = true, features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
tracing-wasm.workspace = true
console_error_panic_hook.workspace = true

[build-dependencies]
fs_extra = "1.3"
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bananas-devtool = { path = "../devtool" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow.workspace = true
