[package]
name = "bananas-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "bananas-cloud"
path = "src/main.rs"

# Cloud SPA — wasm-bindgen target, built by `dx build --features
# wasm-ui --bin bananas-cloud-ui --platform web`. Lives in the same
# package as the daemon so a single IPK ships both; the daemon's
# `build.rs` invokes `dx` and embeds the dist tree at compile time
# via include_dir!. `required-features = ["wasm-ui"]` keeps native
# `cargo check --workspace` from attempting to compile this bin
# against host-only toolchains where dioxus + web-sys are missing.
[[bin]]
name = "bananas-cloud-ui"
path = "src/ui/main.rs"
required-features = ["wasm-ui"]

[features]
# Marker feature gating the SPA bin. Enabled by build.rs (via the
# `dx build --features wasm-ui` invocation) when actually compiling
# the SPA for wasm32.
default = []
wasm-ui = []

# Cross-target deps — both bins need these (serde + serde_json
# share types between the daemon's HTTP handlers and the SPA's
# fetch wrappers).
[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

# Daemon-only — never compiled for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
axum = { workspace = true, features = ["macros"] }
anyhow.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower = "0.5"
tower-http.workspace = true
bananas-engine.workspace = true
bananas-server-common.workspace = true
include_dir = "0.7"

# SPA-only — pulled in only when target = wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bananas-mfe-runtime.workspace = true
# bananas-proto with default features off — `server` pulls in
# tonic transport (hyper) which doesn't compile to wasm32. The
# SPA only needs the generated client + message types.
bananas-proto = { workspace = true, default-features = false }
dioxus.workspace = true
gloo-net = { workspace = true, features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
tracing-wasm.workspace = true
console_error_panic_hook.workspace = true
# gRPC-Web client for `CloudService::TailRunLog`. Same shape as
# the stats SPA (PR-2): `tonic-web-wasm-client::Client` wraps a
# fetch+streaming-bytes channel that the generated stub uses.
tonic = { workspace = true, default-features = false, features = ["codegen"] }
tonic-prost = "0.14"
tonic-web-wasm-client.workspace = true
prost.workspace = true

[build-dependencies]
fs_extra = "1.3"

[dev-dependencies]
tempfile = "3"
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bananas-devtool = { path = "../devtool" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow.workspace = true
