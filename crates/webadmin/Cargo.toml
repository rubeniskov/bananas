[package]
name = "bananas-webadmin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "bananas-webadmin"
path = "src/main.rs"

# Webadmin SPA — wasm-bindgen target, built by `dx build --features
# wasm-ui --bin bananas-webadmin-ui --platform web`. Lives in the
# same package as the daemon so a single IPK ships both; the daemon's
# `build.rs` invokes `dx` and embeds the dist tree at compile time
# via include_dir!. `required-features = ["wasm-ui"]` keeps native
# `cargo check --workspace` from attempting to compile this bin
# against host toolchains where dioxus + web-sys are missing.
[[bin]]
name = "bananas-webadmin-ui"
path = "src/ui/main.rs"
required-features = ["wasm-ui"]

[features]
# Marker feature gating the SPA bin. Enabled by build.rs (via the
# `dx build --features wasm-ui` invocation) when actually compiling
# the SPA for wasm32.
default = []
wasm-ui = []

# Cross-target deps — both bins need these.
[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true

# Daemon-only — never compiled for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
axum = { workspace = true, features = ["macros"] }
anyhow.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower = "0.5"
tower-http.workspace = true
bananas-stats.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
libc.workspace = true
bananas-engine.workspace = true
bananas-server-common.workspace = true
futures-util.workspace = true
async-stream.workspace = true
include_dir = "0.7"
# Direct hyper for the Unix-socket sub-proxy in src/proxy.rs (forwards
# /api/* to bananas-router and /assets/<id>/* to plugin daemons).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# gRPC stack — tonic 0.14 server with tonic-web for the public TCP
# face. The host SPA reaches the same RPCs via tonic-web-wasm-client
# at /api/grpc/*. See `src/grpc.rs`.
bananas-proto.workspace = true
tonic = { workspace = true, features = ["server", "router", "transport"] }
tonic-prost = "0.14"
tonic-web.workspace = true
prost.workspace = true
http = "1"

# SPA-only — pulled in only when target = wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["web", "router"] }
gloo-net = { workspace = true, features = ["http", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
tracing-wasm.workspace = true
console_error_panic_hook.workspace = true

[build-dependencies]
fs_extra = "1.3"

[dev-dependencies]
tempfile = "3"
# e2e harness shared across the workspace — see crates/devtool. The
# test crate is gated on cfg(not(target_arch = "wasm32")) by virtue
# of dev-dependencies only being compiled for the host target, so
# this doesn't pull host-only crates into the wasm-ui build.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bananas-devtool = { path = "../devtool" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls"] }
anyhow.workspace = true
# tonic 0.14 client for the gRPC e2e tests in tests/e2e_grpc_*.rs.
bananas-proto = { workspace = true }
tonic = { workspace = true, features = ["transport"] }
tonic-prost = "0.14"
prost.workspace = true
http = "1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http2"] }
http-body-util = "0.1"
bytes = "1"
tower = "0.5"
