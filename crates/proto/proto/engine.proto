// bananas-engine: privileged-ops daemon RPCs.
//
// PR-4 fills in a single RPC — `Authenticate`, the highest-value
// path because (a) it's hit on every /api/login and (b) it's the
// most security-sensitive, so type-checked wire shapes matter.
// The other 27 `Command` enum variants in
// `crates/engine/src/lib.rs` continue to use the existing
// newline-JSON Unix socket. They migrate one or two at a time in
// follow-up PRs as the engine's tonic mount stabilises.
//
// Engine binary serves both protocols: the legacy newline-JSON
// socket at `BANANAS_ENGINE_SOCKET` (unchanged) and a sibling
// gRPC socket at `BANANAS_ENGINE_GRPC_SOCKET`. Callers pick
// whichever path is migrated for the RPC they need; the
// transition stays incremental.

syntax = "proto3";

package bananas.engine.v1;

service EngineService {
  // Verify a system password by reading /etc/shadow and matching
  // the stored hash. Replies with `lastchg_zero` so the UI can
  // surface the "must change password at first login" path.
  // Maps 1:1 to the existing `Command::Authenticate` variant; the
  // legacy newline-JSON path is the source of truth until every
  // caller is migrated to gRPC.
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);

  // Self-service password rotation. Verifies `old_password`
  // against /etc/shadow before invoking `chpasswd` with
  // `new_password`. Permitted for every user — including root —
  // because the caller has already proven knowledge of the
  // current password. Maps 1:1 to `Command::ChangeOwnPassword`.
  // Errors collapse to `Unauthenticated` with the same redaction
  // policy as Authenticate so callers can't probe usernames.
  rpc ChangeOwnPassword(ChangeOwnPasswordRequest) returns (ChangeOwnPasswordResponse);

  // Schedule a system reboot via `systemctl reboot`. The reply
  // returns synchronously — systemd waits for the reboot unit to
  // run before pulling the trigger — so the caller can render an
  // "applied" banner before the connection closes. Maps 1:1 to
  // `Command::RebootSystem`.
  rpc RebootSystem(RebootSystemRequest) returns (RebootSystemResponse);

  // Set the system timezone to an IANA zone name (e.g.
  // `Europe/Madrid`). The engine validates the name against
  // `/usr/share/zoneinfo/`, runs `timedatectl set-timezone`,
  // persists the choice to `/etc/bananas/system.toml`, and
  // restarts bananas-dashboard so the LCD reflects the new
  // offset. Maps 1:1 to `Command::SetTimezone`.
  rpc SetTimezone(SetTimezoneRequest) returns (SetTimezoneResponse);

  // Enumerate every IANA zone the OS knows about (sorted, with
  // the `Etc/`, `posix/`, `right/`, `SystemV/` legacy trees
  // pruned). Backs the Settings → General timezone autocomplete.
  // Maps 1:1 to `Command::ListTimezones`.
  rpc ListTimezones(ListTimezonesRequest) returns (ListTimezonesResponse);
}

message AuthenticateRequest {
  string username = 1;
  string password = 2;
}

message AuthenticateResponse {
  // True for /etc/shadow's third field == 0 — the "chage -d 0"
  // sentinel that means "must rotate password before any session
  // is granted". The current Command::Authenticate response uses
  // a magic "password_expired" error string for this; protobuf
  // gives us a real boolean instead.
  bool lastchg_zero = 1;
}

message ChangeOwnPasswordRequest {
  string username = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangeOwnPasswordResponse {
  // No structured reply needed — success is encoded in the gRPC
  // status itself. Reserved for future fields (e.g. the new
  // lastchg day count) without breaking the wire format.
}

message RebootSystemRequest {}

message RebootSystemResponse {
  // Captured stdout+stderr from `systemctl reboot` (typically a
  // single "Reboot scheduled" line — kept verbatim so the UI can
  // surface unit-failure detail if any).
  string output = 1;
}

message SetTimezoneRequest {
  string tz = 1;
}

message SetTimezoneResponse {
  // Combined output from timedatectl + the system.toml writer +
  // the dashboard restart. Surfaced verbatim so the UI can show
  // any sub-step failure.
  string output = 1;
}

message ListTimezonesRequest {}

message ListTimezonesResponse {
  // Sorted list of IANA zone names available on the host.
  repeated string zones = 1;
}
