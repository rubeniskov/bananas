// bananas-engine: privileged-ops daemon RPCs.
//
// PR-4 fills in a single RPC — `Authenticate`, the highest-value
// path because (a) it's hit on every /api/login and (b) it's the
// most security-sensitive, so type-checked wire shapes matter.
// The other 27 `Command` enum variants in
// `crates/engine/src/lib.rs` continue to use the existing
// newline-JSON Unix socket. They migrate one or two at a time in
// follow-up PRs as the engine's tonic mount stabilises.
//
// Engine binary serves both protocols: the legacy newline-JSON
// socket at `BANANAS_ENGINE_SOCKET` (unchanged) and a sibling
// gRPC socket at `BANANAS_ENGINE_GRPC_SOCKET`. Callers pick
// whichever path is migrated for the RPC they need; the
// transition stays incremental.

syntax = "proto3";

package bananas.engine.v1;

service EngineService {
  // Verify a system password by reading /etc/shadow and matching
  // the stored hash. Replies with `lastchg_zero` so the UI can
  // surface the "must change password at first login" path.
  // Maps 1:1 to the existing `Command::Authenticate` variant; the
  // legacy newline-JSON path is the source of truth until every
  // caller is migrated to gRPC.
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);

  // Self-service password rotation. Verifies `old_password`
  // against /etc/shadow before invoking `chpasswd` with
  // `new_password`. Permitted for every user — including root —
  // because the caller has already proven knowledge of the
  // current password. Maps 1:1 to `Command::ChangeOwnPassword`.
  // Errors collapse to `Unauthenticated` with the same redaction
  // policy as Authenticate so callers can't probe usernames.
  rpc ChangeOwnPassword(ChangeOwnPasswordRequest) returns (ChangeOwnPasswordResponse);

  // Schedule a system reboot via `systemctl reboot`. The reply
  // returns synchronously — systemd waits for the reboot unit to
  // run before pulling the trigger — so the caller can render an
  // "applied" banner before the connection closes. Maps 1:1 to
  // `Command::RebootSystem`.
  rpc RebootSystem(RebootSystemRequest) returns (RebootSystemResponse);

  // Set the system timezone to an IANA zone name (e.g.
  // `Europe/Madrid`). The engine validates the name against
  // `/usr/share/zoneinfo/`, runs `timedatectl set-timezone`,
  // persists the choice to `/etc/bananas/system.toml`, and
  // restarts bananas-dashboard so the LCD reflects the new
  // offset. Maps 1:1 to `Command::SetTimezone`.
  rpc SetTimezone(SetTimezoneRequest) returns (SetTimezoneResponse);

  // Enumerate every IANA zone the OS knows about (sorted, with
  // the `Etc/`, `posix/`, `right/`, `SystemV/` legacy trees
  // pruned). Backs the Settings → General timezone autocomplete.
  // Maps 1:1 to `Command::ListTimezones`.
  rpc ListTimezones(ListTimezonesRequest) returns (ListTimezonesResponse);

  // Read a known TOML config file under /etc/bananas/. The
  // `name` field is one of the curated allowlist entries
  // (`system`, …) — arbitrary paths are rejected. A missing
  // file maps to an empty `content` string so the UI can show
  // a fresh editor without a banner.
  // Maps 1:1 to `Command::ReadServiceConfig`.
  rpc ReadServiceConfig(ReadServiceConfigRequest) returns (ReadServiceConfigResponse);

  // Write a known TOML config file under /etc/bananas/. Same
  // allowlist as `ReadServiceConfig`. The engine validates the
  // content is parseable TOML, writes atomically (sibling tmp +
  // rename), and restarts any associated systemd units.
  // Maps 1:1 to `Command::WriteServiceConfig`.
  rpc WriteServiceConfig(WriteServiceConfigRequest) returns (WriteServiceConfigResponse);

  // Refresh opkg's package metadata cache (`opkg update`). Hits
  // the configured feed; failures here usually mean the network
  // is offline. Maps 1:1 to `Command::OpkgUpdate`.
  rpc OpkgUpdate(OpkgUpdateRequest) returns (OpkgUpdateResponse);

  // Enumerate every opkg package whose installed version is
  // older than the candidate in the cached metadata. The wire
  // shape is now typed (`repeated UpgradablePackage`) instead of
  // a JSON-encoded string. Maps 1:1 to `Command::OpkgListUpgradable`.
  rpc OpkgListUpgradable(OpkgListUpgradableRequest) returns (OpkgListUpgradableResponse);

  // Enumerate every installed package. Same wire-shape upgrade
  // as ListUpgradable. Maps 1:1 to `Command::OpkgListInstalled`.
  rpc OpkgListInstalled(OpkgListInstalledRequest) returns (OpkgListInstalledResponse);

  // Spawn the transient `bananas-opkg-upgrade.service` to run
  // `opkg upgrade <packages>` in the background. Returns
  // immediately once systemd-run has acknowledged; the caller
  // polls OpkgUpgradeStatus to track progress and emit log
  // delta. Maps 1:1 to `Command::OpkgUpgrade`.
  rpc OpkgUpgrade(OpkgUpgradeRequest) returns (OpkgUpgradeResponse);

  // Read the current state of the transient upgrade unit. The
  // engine appends opkg's stdout/stderr to a sentinel-tailed log
  // file; `since` lets the caller request only new bytes. Maps
  // 1:1 to `Command::OpkgUpgradeStatus`.
  rpc OpkgUpgradeStatus(OpkgUpgradeStatusRequest) returns (OpkgUpgradeStatusResponse);
}

message AuthenticateRequest {
  string username = 1;
  string password = 2;
}

message AuthenticateResponse {
  // True for /etc/shadow's third field == 0 — the "chage -d 0"
  // sentinel that means "must rotate password before any session
  // is granted". The current Command::Authenticate response uses
  // a magic "password_expired" error string for this; protobuf
  // gives us a real boolean instead.
  bool lastchg_zero = 1;
}

message ChangeOwnPasswordRequest {
  string username = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangeOwnPasswordResponse {
  // No structured reply needed — success is encoded in the gRPC
  // status itself. Reserved for future fields (e.g. the new
  // lastchg day count) without breaking the wire format.
}

message RebootSystemRequest {}

message RebootSystemResponse {
  // Captured stdout+stderr from `systemctl reboot` (typically a
  // single "Reboot scheduled" line — kept verbatim so the UI can
  // surface unit-failure detail if any).
  string output = 1;
}

message SetTimezoneRequest {
  string tz = 1;
}

message SetTimezoneResponse {
  // Combined output from timedatectl + the system.toml writer +
  // the dashboard restart. Surfaced verbatim so the UI can show
  // any sub-step failure.
  string output = 1;
}

message ListTimezonesRequest {}

message ListTimezonesResponse {
  // Sorted list of IANA zone names available on the host.
  repeated string zones = 1;
}

message ReadServiceConfigRequest {
  // Allowlisted name (e.g. `system`); not a filesystem path.
  string name = 1;
}

message ReadServiceConfigResponse {
  // Raw TOML file contents. Empty when the file doesn't exist.
  string content = 1;
}

message WriteServiceConfigRequest {
  string name = 1;
  string content = 2;
}

message WriteServiceConfigResponse {
  // Combined output from the write + post-write systemctl
  // restarts (one line per unit). Empty when no units are
  // associated with this config name.
  string output = 1;
}

message OpkgUpdateRequest {}

message OpkgUpdateResponse {
  // Captured stdout+stderr from `opkg update`.
  string output = 1;
}

message OpkgListUpgradableRequest {}

message UpgradablePackage {
  string name = 1;
  string installed = 2;
  string candidate = 3;
}

message OpkgListUpgradableResponse {
  repeated UpgradablePackage packages = 1;
}

message OpkgListInstalledRequest {}

message InstalledPackage {
  string name = 1;
  string version = 2;
}

message OpkgListInstalledResponse {
  repeated InstalledPackage packages = 1;
}

message OpkgUpgradeRequest {
  // Each name must already be in the bananas-* allowlist; the
  // webadmin layer enforces that before calling. The engine
  // refuses to spawn a second transient unit while one is
  // active (returns `FailedPrecondition` on conflict).
  repeated string packages = 1;
}

message OpkgUpgradeResponse {
  // Output from `systemd-run`, captured for diagnostics.
  string output = 1;
}

message OpkgUpgradeStatusRequest {
  // Byte offset already consumed; the engine returns log bytes
  // from `since` to current EOF.
  uint64 since = 1;
}

message OpkgUpgradeStatusResponse {
  // One of: `idle`, `active`, `done`, `failed`.
  string state = 1;
  // Log delta from the requested `since` offset. Empty when the
  // caller is already caught up.
  string log = 2;
  // Current log size in bytes. Echo back as `since` on the next
  // call to keep the cursor moving.
  uint64 log_offset = 3;
  // Populated once the unit has exited (the `[bananas-opkg-exit=N]`
  // sentinel is present). Encoded as int32 with -1 sentinel for
  // "not yet present" so the protobuf wire format stays stable.
  int32 exit_code = 4;
  // True iff `exit_code` carries a real value; protobuf's int32
  // can't distinguish 0 from "unset" without this companion bool.
  bool has_exit_code = 5;
}
