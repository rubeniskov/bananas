[package]
name = "bananas-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Slint LCD dashboard + web config plugin daemon. The Slint binary (bananas-dashboard) renders live CPU/mem/network/disk on the BPI's 5\" panel; bananas-dashboard-web is the web plugin daemon that owns /api/dashboard/config (the appearance/refresh-rate config form)."

# Slint LCD app — original bin. Native armv7, talks to the
# bananas-stats live socket and renders via Mali-400 (lima) + KMS.
# Gated behind the `slint-app` feature so the e2e harness can
# build only the web daemon without dragging in fontconfig.
[[bin]]
name = "bananas-dashboard"
path = "src/main.rs"
required-features = ["slint-app"]

# Web plugin daemon — answers /api/dashboard/config (read +
# write of /etc/bananas/dashboard.toml via bananas-engine) and
# /assets/dashboard/* (the wasm SPA). Native build, separate
# from the Slint bin.
[[bin]]
name = "bananas-dashboard-web"
path = "src/web/main.rs"

# Wasm SPA — the Dashboard tab in the host webadmin shell.
[[bin]]
name = "bananas-dashboard-web-ui"
path = "src/ui/main.rs"
required-features = ["wasm-ui"]

[features]
# `slint-app` is opt-in — pulling it in by default would force every
# `cargo test`/`cargo check --workspace` on the host to compile slint
# + fontconfig, which the e2e harness doesn't need. The production
# armv7 build (build-dashboard-arm) explicitly opts in.
default = []
wasm-ui = []
slint-app = ["dep:slint", "dep:bananas-stats"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Native-only deps. Excluded from wasm32 so the SPA bin doesn't
# pull in tokio/slint/sqlite. `slint` + `bananas-stats` are gated
# behind the `slint-app` feature so the web daemon (and the e2e
# harness) can build without fontconfig on the host.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bananas-stats = { workspace = true, optional = true }
slint = { workspace = true, optional = true }
bananas-proto = { workspace = true, features = ["server"] }
tonic = { workspace = true, features = ["transport"] }
bananas-server-common.workspace = true
tokio.workspace = true
toml.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true
time.workspace = true
axum = { workspace = true, features = ["macros"] }
tower-http.workspace = true
include_dir = "0.7"

# SPA-only deps.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bananas-mfe-runtime.workspace = true
bananas-config-form.workspace = true
dioxus.workspace = true
gloo-net = { workspace = true, features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
toml.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
tracing-wasm.workspace = true
console_error_panic_hook.workspace = true

[build-dependencies]
slint-build.workspace = true
fs_extra = "1.3"
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bananas-devtool = { path = "../devtool" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow.workspace = true
