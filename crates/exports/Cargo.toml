[package]
name = "bananas-exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "bananas-exports"
path = "src/main.rs"

# Plugin SPA — built by `dx build --features wasm-ui --bin
# bananas-exports-ui --platform web`. Lives in the same package
# as the daemon so a single IPK ships both; the daemon's
# `build.rs` invokes `dx` and embeds the dist tree at compile
# time via include_dir!. `required-features = ["wasm-ui"]` keeps
# native `cargo check --workspace` from attempting to compile
# this bin against host-only toolchains where dioxus + web-sys
# are missing.
[[bin]]
name = "bananas-exports-ui"
path = "src/ui/main.rs"
required-features = ["wasm-ui"]

[features]
default = []
wasm-ui = []

# Cross-target deps — both bins share these (serde for shared
# types between API handlers and SPA fetch wrappers).
[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Daemon-only — never compiled for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
axum = { workspace = true, features = ["macros"] }
anyhow.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower-http.workspace = true
bananas-engine.workspace = true
bananas-server-common.workspace = true
include_dir = "0.7"
libc.workspace = true

# SPA-only — pulled in only when target = wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bananas-mfe-runtime.workspace = true
dioxus.workspace = true
gloo-net = { workspace = true, features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
tracing-wasm.workspace = true
console_error_panic_hook.workspace = true

[build-dependencies]
fs_extra = "1.3"
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bananas-devtool = { path = "../devtool" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow.workspace = true
